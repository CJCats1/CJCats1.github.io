name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and simulation source
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure simulation
        run: emcmake cmake -S physics-sandbox -B physics-sandbox/build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build simulation
        run: cmake --build physics-sandbox/build-web --config Release -j2

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p site/simulations/physics-sandbox
          cp index.html site/index.html
          cp -R assets site/assets
          cp physics-sandbox/build-web/spring_mass_sandbox.html site/simulations/physics-sandbox/index.html
          cp physics-sandbox/build-web/spring_mass_sandbox.js site/simulations/physics-sandbox/
          cp physics-sandbox/build-web/spring_mass_sandbox.wasm site/simulations/physics-sandbox/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
